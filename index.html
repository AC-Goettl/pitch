    var branchRows = BRANCH_ORDER
      .filter(function (b) { return branch === "ALL" || b === branch; })
      .map(function (b) { return byBranch[b]; }).filter(Boolean).map(function (r) {
      var pr = pct(r.pitched, r.jobs), cr = pct(r.closed, r.pitched), rgcr = Math.ceil(pr * cr / 100);
      // Missed Sold (Option B): at/above target → 0; below → ceiling of raw miss.
      // RGCR is ceiled to the whole percent first, so a branch that rounds up to
      // target (e.g. 39.5 → 40) counts as on-target and shows 0 missed.
      // Dollars priced off the whole count so count and $ stay consistent.
      // Missed = sum of each member's own missed vs its own target (so a bucket
      // doesn't apply D3's target to D2/D1 volume). Single type = its own missed.
      var missedSales = missedForBranchPub(jobType, r.branch);
      var branchAvg = D.AVG_TICKET_BY_BRANCH[r.branch] != null ? D.AVG_TICKET_BY_BRANCH[r.branch] : D.AVG_TICKET_CONSOLIDATED;
      var o = {}; for (var k in r) o[k] = r[k];
      o.pitchRate = pr; o.closeRate = cr; o.rgcr = rgcr; o.missedSales = missedSales; o.missedDollars = missedSales * branchAvg;
      return o;
    });

    var sum = branchRows.reduce(function (a, r) {
      return {
        jobs: a.jobs + r.jobs, estimates: a.estimates + r.estimates, pitched: a.pitched + r.pitched, closed: a.closed + r.closed,
        revenue: a.revenue + r.revenue, missedSales: a.missedSales + r.missedSales, missedDollars: a.missedDollars + r.missedDollars,
        star: a.star.map(function (v, i) { return v + ((r.star && r.star[i]) || 0); }),
        partialSold: a.partialSold + (r.partialSold || 0), partialPitched: a.partialPitched + (r.partialPitched || 0),
        iaqJobs: a.iaqJobs + (r.iaqJobs || 0), insJobs: a.insJobs + (r.insJobs || 0), ductJobs: a.ductJobs + (r.ductJobs || 0),
        iaqSold: a.iaqSold + (r.iaqSold || 0), insSold: a.insSold + (r.insSold || 0), ductSold: a.ductSold + (r.ductSold || 0),
        chanPitched: a.chanPitched + (r.chanPitched || 0), chanSold: a.chanSold + (r.chanSold || 0)
      };
    }, { jobs: 0, estimates: 0, pitched: 0, closed: 0, revenue: 0, missedSales: 0, missedDollars: 0, star: [0,0,0,0,0], partialSold: 0, partialPitched: 0, iaqJobs: 0, insJobs: 0, ductJobs: 0, iaqSold: 0, insSold: 0, ductSold: 0, chanPitched: 0, chanSold: 0 });

    var totalPitch = pct(sum.pitched, sum.jobs), totalClose = pct(sum.closed, sum.pitched), totalRgcr = Math.ceil(totalPitch * totalClose / 100);
    var chanTotalPitch = pct(sum.chanPitched, sum.jobs), chanTotalClose = pct(sum.chanSold, sum.chanPitched), chanTotalRgcr = Math.ceil(chanTotalPitch * chanTotalClose / 100);
    var chanTgt = chanTargetFor(jobType);
    var chanMissedSales = branchRows.reduce(function (a, r) {
      var cpr = pct(r.chanPitched, r.jobs);
      var ccr = pct(r.chanSold, r.chanPitched);
      var crgcr = Math.ceil(cpr * ccr / 100);
      return a + (crgcr < chanTgt.rgcr ? Math.ceil(r.jobs * (chanTgt.rgcr - crgcr) / 100) : 0);
    }, 0);
    var chanMissedDollars = chanMissedSales * D.CHANNEL_AVG_TICKET;
    var missed = sum.missedSales, missedDollars = sum.missedDollars;
    var missedAvgTicket = (branch !== "ALL" && D.AVG_TICKET_BY_BRANCH[branch] != null)
      ? D.AVG_TICKET_BY_BRANCH[branch] : D.AVG_TICKET_CONSOLIDATED;

    var rateColor = function (rate, target) { return target == null ? C.darkBlue : rate >= target ? C.darkBlue : C.red; };
    var rgcrCell = function (rgcr) { if (tgt == null) return { bg: "transparent", fg: C.darkBlue }; return rgcr >= tgt.rgcr ? { bg: "#e3f4e8", fg: "#1a7a3c" } : { bg: "#fdeaea", fg: C.red }; };

    if (branchRows.length === 0) {
      return '<div style="background:#eef3f7;border-radius:8px;padding:24px;font-size:14px;font-weight:600;color:' + C.medBlue + ';text-align:center;">No ' + esc(jobTypeLabel) + ' jobs in this snapshot.</div>';
    }

    var html = "";

    // Header
    html += '<div style="text-align:center;margin-bottom:20px;">' +
      '<h1>' + esc(jobTypeLabel) + ' ' + (section === "chan" ? "Channels" : "Replacement") + ' Performance – by Branch</h1>' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;">' +
      '<span style="height:2px;width:80px;background:' + C.darkBlue + ';"></span>' +
      '<span style="font-weight:600;font-size:15px;color:' + C.medBlue + ';">Summary&nbsp; | &nbsp;' + esc(curRangeLabel()) + '</span>' +
      '<span style="height:2px;width:80px;background:' + C.darkBlue + ';"></span></div>' +
      (section === "chan"
        ? '<div style="margin-top:8px;font-size:12.5px;font-weight:600;color:' + C.medBlue + ';">Targets — PR ' + chanTgt.pr + '% · CR ' + chanTgt.cr + '% · CGCR ' + chanTgt.rgcr + '%</div>'
        : (tgt ? '<div style="margin-top:8px;font-size:12.5px;font-weight:600;color:' + C.medBlue + ';">Targets — PR ' + tgt.pr + '% · RCR ' + tgt.rcr + '% · RGCR ' + tgt.rgcr + '%</div>'
               : '<div style="margin-top:8px;font-size:12.5px;font-weight:600;color:' + C.gray + ';">No targets set for ' + esc(jobTypeLabel) + '</div>')) +
      '</div>';

    // Shared missed-sold cell renderer (used by both replacement and channel tables).
    var missedCellHtml = function (cnt, dollars, boldNav) {
      var col = cnt > 0 ? C.red : C.darkBlue;
      return '<td style="' + td + 'font-weight:700;color:' + col + ';">' + cnt +
        '<span style="display:block;font-size:10.5px;font-weight:' + (boldNav ? 700 : 600) + ';color:' + (boldNav ? C.navy : C.gray) + ';">' + fmtMoney(dollars) + '</span></td>';
    };

    if (section === "repl") {

    // Replacement table — Missed Sold column shown only when the job type has a target.
    var missedCol = !!tgt;
    var replSpan = missedCol ? 9 : 8;      // total data columns (for mix-bar colspan)
    var replGroup = missedCol ? 6 : 5;     // "Replacement" group header span
    var rowsHtml = branchRows.map(function (r, idx) {
      var bg = idx % 2 ? "#f3f7fa" : "#fff";
      var rc = rgcrCell(r.rgcr);
      var main = '<tr style="background:' + bg + ';">' +
        '<td style="' + td + 'text-align:left;font-weight:600;">' + esc(r.branch) + '</td>' +
        jobCell(r.branch, jobType, r.jobs, "repl") +
        '<td style="' + td + '">' + r.estimates + '</td>' +
        '<td style="' + td + 'border-left:1px solid #e3e9ee;font-weight:700;">' + r.pitched + '</td>' +
        '<td style="' + td + 'font-weight:700;">' + r.closed + '</td>' +
        '<td style="' + td + 'font-weight:700;color:' + rateColor(r.pitchRate, tgt && tgt.pr) + ';">' + r.pitchRate + '%</td>' +
        '<td style="' + td + 'font-weight:700;color:' + rateColor(r.closeRate, tgt && tgt.rcr) + ';">' + r.closeRate + '%</td>' +
        '<td style="' + td + 'font-weight:800;background:' + rc.bg + ';color:' + rc.fg + ';">' + r.rgcr + '%</td>' +
        (missedCol ? missedCellHtml(r.missedSales, r.missedDollars, false) : '') + '</tr>';
      var mix = '<tr style="background:' + bg + ';border-bottom:1px solid #e3e9ee;"><td colspan="' + replSpan + '" style="padding:0 12px 10px 12px;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:10px;font-weight:700;color:' + C.medBlue + ';min-width:70px;text-transform:uppercase;">Star mix</span>' +
        '<div style="flex:1;">' + mixBar(D.STAR_COLORS.map(function (c, i) { return { label: D.STAR_LABELS[i], value: (r.star && r.star[i]) || 0, color: c }; }).concat([{ label: "Partial", value: r.partialSold || 0, color: D.PARTIAL_COLOR }])) + '</div></div></td></tr>';
      return main + mix;
    }).join("");

    var totRc = rgcrCell(totalRgcr);
    var totalsRow = '<tr style="background:#e8eef3;font-weight:800;color:' + C.darkBlue + ';">' +
      '<td style="' + td + 'text-align:left;font-weight:800;">TOTALS</td>' +
      '<td style="' + tdBold + '">' + sum.jobs + '</td>' +
      '<td style="' + tdBold + '">' + sum.estimates + '</td>' +
      '<td style="' + tdBold + 'border-left:1px solid #d4dde4;">' + sum.pitched + '</td>' +
      '<td style="' + tdBold + '">' + sum.closed + '</td>' +
      '<td style="' + tdBold + 'color:' + rateColor(totalPitch, tgt && tgt.pr) + ';">' + totalPitch + '%</td>' +
      '<td style="' + tdBold + 'color:' + rateColor(totalClose, tgt && tgt.rcr) + ';">' + totalClose + '%</td>' +
      '<td style="' + tdBold + 'background:' + totRc.bg + ';color:' + totRc.fg + ';">' + totalRgcr + '%</td>' +
      (missedCol ? missedCellHtml(missed, missedDollars, true) : '') + '</tr>' +
      '<tr style="background:#e8eef3;"><td colspan="' + replSpan + '" style="padding:0 12px 10px 12px;"><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:10px;font-weight:800;color:' + C.darkBlue + ';min-width:70px;text-transform:uppercase;">Star mix</span><div style="flex:1;">' +
      mixBar(D.STAR_COLORS.map(function (c, i) { return { label: D.STAR_LABELS[i], value: sum.star[i], color: c }; }).concat([{ label: "Partial", value: sum.partialSold || 0, color: D.PARTIAL_COLOR }]), true) + '</div></div></td></tr>';

    html += '<div class="card"><table><thead>' +
      '<tr style="background:' + C.darkBlue + ';color:#fff;"><th rowspan="2" style="' + thBase("left") + '">Branch</th>' +
      '<th colspan="2" style="' + thBase() + 'border-bottom:1px solid rgba(255,255,255,0.25);font-size:13px;letter-spacing:0.04em;">' + esc(jobTypeLabel) + '</th>' +
      '<th colspan="' + replGroup + '" style="' + thBase() + 'border-bottom:1px solid rgba(255,255,255,0.25);border-left:1px solid rgba(255,255,255,0.25);font-size:13px;letter-spacing:0.04em;">Replacement</th></tr>' +
      '<tr style="background:' + C.darkBlue + ';color:#fff;"><th style="' + thBase() + '"># Jobs</th><th style="' + thBase() + '"># Est</th>' +
      '<th style="' + thBase() + 'border-left:1px solid rgba(255,255,255,0.25);"># Pitched</th><th style="' + thBase() + '"># Closed</th>' +
      '<th style="' + thBase() + '">% Pitch Rate</th><th style="' + thBase() + '">% Pitched Close Rate</th><th style="' + thBase() + '">% Gross Close Rate</th>' +
      (missedCol ? '<th style="' + thBase() + '">Missed Sold</th>' : '') + '</tr>' +
      '</thead><tbody>' + rowsHtml + totalsRow + '</tbody></table></div>';

    // Replacement KPIs
    html += '<div class="kpis"' + (tgt ? '' : ' style="grid-template-columns:repeat(4,1fr);"') + '>' +
      kpiCard({ title: "Pitch Rate", big: totalPitch + "%", sub: tgt ? "Target " + tgt.pr + "%" : "No target", alert: tgt ? totalPitch < tgt.pr : false }) +
      kpiCard({ title: "Close Rate", big: totalClose + "%", sub: tgt ? "Target " + tgt.rcr + "%" : "No target", alert: tgt ? totalClose < tgt.rcr : false }) +
      kpiCard({ title: "GROSS CLOSE RATE", big: totalRgcr + "%", sub: tgt ? "Target " + tgt.rgcr + "%" : "No target", good: tgt ? totalRgcr >= tgt.rgcr : null, alert: tgt ? totalRgcr < tgt.rgcr : false }) +
      kpiCard({ title: "Replacement Sold", big: sum.closed, sub: sum.pitched + " pitched · " + sum.jobs + " jobs" }) +
      (tgt ? kpiCard({ title: "Missed Sold KPI By", big: missed, sub: "$" + (missedAvgTicket / 1000).toFixed(1) + "K Avg Sale", extra: fmtMoney(missedDollars), alert: missed > 0 }) : "") +
      '</div>';
    html += '<p class="note" style="margin-top:18px;">RGCR = Pitch Rate × Close Rate; green ≥ target, red below. Missed = jobs × (target RGCR − actual RGCR), priced at each branch\'s average replacement ticket from ' + esc(D.AVG_TICKET_SOURCE) + '. Data lake refreshes ~3:00am; today\'s jobs appear tomorrow.</p>';
    } // end repl section

    if (section === "chan") {
    // Channels table (channel targets always exist, so Missed Sold always shows)
    var chanRowsHtml = branchRows.map(function (r, idx) {
      var bg = idx % 2 ? "#f3f7fa" : "#fff";
      var cpr = pct(r.chanPitched, r.jobs), ccr = pct(r.chanSold, r.chanPitched), crgcr = Math.ceil(cpr * ccr / 100);
      var good = crgcr >= chanTgt.rgcr;
      var cMiss = crgcr < chanTgt.rgcr ? Math.ceil(r.jobs * (chanTgt.rgcr - crgcr) / 100) : 0;
      var main = '<tr style="background:' + bg + ';">' +
        '<td style="' + td + 'text-align:left;font-weight:600;">' + esc(r.branch) + '</td>' +
        jobCell(r.branch, jobType, r.jobs, "chan") +
        '<td style="' + td + '">' + r.estimates + '</td>' +
        '<td style="' + td + 'border-left:1px solid #e3e9ee;font-weight:700;">' + (r.chanPitched || 0) + '</td>' +
        '<td style="' + td + 'font-weight:700;">' + (r.chanSold || 0) + '</td>' +
        '<td style="' + td + 'font-weight:700;color:' + rateColor(cpr, chanTgt.pr) + ';">' + cpr + '%</td>' +
        '<td style="' + td + 'font-weight:700;color:' + rateColor(ccr, chanTgt.cr) + ';">' + ccr + '%</td>' +
        '<td style="' + td + 'font-weight:800;background:' + (good ? "#e3f4e8" : "#fdeaea") + ';color:' + (good ? "#1a7a3c" : C.red) + ';">' + crgcr + '%</td>' +
        missedCellHtml(cMiss, cMiss * D.CHANNEL_AVG_TICKET, false) + '</tr>';
      var mix = '<tr style="background:' + bg + ';border-bottom:1px solid #e3e9ee;"><td colspan="9" style="padding:0 12px 10px 12px;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:10px;font-weight:700;color:' + C.medBlue + ';min-width:90px;text-transform:uppercase;">Channel mix</span><div style="flex:1;">' +
        mixBar([{ label: "IAQ", value: r.iaqSold || 0, color: D.CHAN_COLORS.IAQ }, { label: "Insulation", value: r.insSold || 0, color: D.CHAN_COLORS.INS }, { label: "Duct", value: r.ductSold || 0, color: D.CHAN_COLORS.DUCT }]) + '</div></div></td></tr>';
      return main + mix;
    }).join("");

    var chGood = chanTotalRgcr >= chanTgt.rgcr;
    var chanTotalsRow = '<tr style="background:#e8eef3;font-weight:800;color:' + C.darkBlue + ';">' +
      '<td style="' + td + 'text-align:left;font-weight:800;">TOTALS</td>' +
      '<td style="' + tdBold + '">' + sum.jobs + '</td>' +
      '<td style="' + tdBold + '">' + sum.estimates + '</td>' +
      '<td style="' + tdBold + 'border-left:1px solid #d4dde4;">' + sum.chanPitched + '</td>' +
      '<td style="' + tdBold + '">' + sum.chanSold + '</td>' +
      '<td style="' + tdBold + 'color:' + rateColor(chanTotalPitch, chanTgt.pr) + ';">' + chanTotalPitch + '%</td>' +
      '<td style="' + tdBold + 'color:' + rateColor(chanTotalClose, chanTgt.cr) + ';">' + chanTotalClose + '%</td>' +
      '<td style="' + tdBold + 'background:' + (chGood ? "#e3f4e8" : "#fdeaea") + ';color:' + (chGood ? "#1a7a3c" : C.red) + ';">' + chanTotalRgcr + '%</td>' +
      missedCellHtml(chanMissedSales, chanMissedDollars, true) + '</tr>' +
      '<tr style="background:#e8eef3;"><td colspan="9" style="padding:0 12px 10px 12px;"><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:10px;font-weight:800;color:' + C.darkBlue + ';min-width:90px;text-transform:uppercase;">Channel mix</span><div style="flex:1;">' +
      mixBar([{ label: "IAQ", value: sum.iaqSold, color: D.CHAN_COLORS.IAQ }, { label: "Insulation", value: sum.insSold, color: D.CHAN_COLORS.INS }, { label: "Duct", value: sum.ductSold, color: D.CHAN_COLORS.DUCT }], true) + '</div></div></td></tr>';

    html += '<div style="text-align:center;margin:6px 0 14px;"></div>';

    html += '<div class="card"><table><thead>' +
      '<tr style="background:' + C.darkBlue + ';color:#fff;"><th rowspan="2" style="' + thBase("left") + '">Branch</th>' +
      '<th colspan="2" style="' + thBase() + 'border-bottom:1px solid rgba(255,255,255,0.25);font-size:13px;letter-spacing:0.04em;">' + esc(jobTypeLabel) + '</th>' +
      '<th colspan="6" style="' + thBase() + 'border-bottom:1px solid rgba(255,255,255,0.25);border-left:1px solid rgba(255,255,255,0.25);font-size:13px;letter-spacing:0.04em;">Channels</th></tr>' +
      '<tr style="background:' + C.darkBlue + ';color:#fff;"><th style="' + thBase() + '"># Jobs</th><th style="' + thBase() + '"># Est</th>' +
      '<th style="' + thBase() + 'border-left:1px solid rgba(255,255,255,0.25);"># Pitched</th><th style="' + thBase() + '"># Closed</th>' +
      '<th style="' + thBase() + '">% Pitch Rate</th><th style="' + thBase() + '">% Pitched Close Rate</th><th style="' + thBase() + '">% Gross Close Rate</th><th style="' + thBase() + '">Missed Sold</th></tr>' +
      '</thead><tbody>' + chanRowsHtml + chanTotalsRow + '</tbody></table></div>';

    html += '<div class="kpis" style="margin-bottom:8px;">' +
      kpiCard({ title: "Pitch Rate", big: chanTotalPitch + "%", sub: "Target " + chanTgt.pr + "%", alert: chanTotalPitch < chanTgt.pr }) +
      kpiCard({ title: "Close Rate", big: chanTotalClose + "%", sub: "Target " + chanTgt.cr + "%", alert: chanTotalClose < chanTgt.cr }) +
      kpiCard({ title: "GROSS CLOSE RATE", big: chanTotalRgcr + "%", sub: "Target " + chanTgt.rgcr + "%", good: chGood, alert: !chGood }) +
      kpiCard({ title: "Channels Sold", big: sum.chanSold, sub: sum.chanPitched + " pitched · " + sum.jobs + " jobs" }) +
      kpiCard({ title: "Missed Sold KPI By", big: chanMissedSales, sub: "$" + (D.CHANNEL_AVG_TICKET / 1000).toFixed(1) + "K Avg Sale", extra: fmtMoney(chanMissedDollars), alert: chanMissedSales > 0 }) +
      '</div>';
    html += '<p class="note" style="margin-bottom:8px;">Channels consolidated across IAQ / Insulation / Duct (a job counts once even if it spans channels). Classified via cross-sale group, standalone duct-sealing excluded. Mix bars show each channel\'s share of sold channel jobs. Missed = jobs × (target CGCR − actual CGCR) × ' + D.CHANNEL_AVG_TICKET.toLocaleString() + ' fixed Avg Sale.</p>';
    } // end chan section

    return html;
  }

  var sel = document.getElementById("jobTypeSel");
  var FORDER = D.FILTER_ORDER || JOB_TYPES;
  var FLABELS = D.FILTER_LABELS || {};
  var hasData = function (v) {
    var mem = (D.BUCKETS && D.BUCKETS[v]) || [v];
    return mem.some(function (jt) { return D.rowsByType[jt] && D.rowsByType[jt].length > 0; });
  };
  FORDER.forEach(function (v) {
    if (!hasData(v)) return;
    var opt = document.createElement("option");
    opt.value = v; opt.textContent = FLABELS[v] || v;
    sel.appendChild(opt);
  });
  var initial = D.initialJobType;
  if (!hasData(initial)) {
    initial = (sel.options[0] || {}).value || D.initialJobType;
  }
  sel.value = initial;

  var brSel = document.getElementById("branchSel");
  var allOpt = document.createElement("option");
  allOpt.value = "ALL"; allOpt.textContent = "ALL";
  brSel.appendChild(allOpt);
  BRANCH_ORDER.forEach(function (b) {
    var opt = document.createElement("option");
    opt.value = b; opt.textContent = b;
    brSel.appendChild(opt);
  });
  brSel.value = D.initialBranch || "ALL";

  var secSel = document.getElementById("sectionSel");
  if (secSel) secSel.value = D.initialSection || "repl";

  // Date range dropdown (MTD / Trailing 7 / Trailing 14).
  var dateSel = document.getElementById("dateSel");
  if (dateSel && D.ranges) {
    var order = D.RANGE_ORDER || ["MTD", "T7", "T14"];
    var labels = D.RANGE_LABELS || { MTD: "Month-to-Date", T7: "Trailing 7", T14: "Trailing 14" };
    order.forEach(function (k) {
      if (!D.ranges[k]) return;
      var o = document.createElement("option");
      o.value = k; o.textContent = labels[k] || k;
      dateSel.appendChild(o);
    });
    dateSel.value = D.initialRange || order[0];
    applyRange(dateSel.value);   // set active data before first draw
  }

  function draw() { document.getElementById("root").innerHTML = render(sel.value, brSel.value, secSel ? secSel.value : "repl"); }
  sel.addEventListener("change", draw);
  brSel.addEventListener("change", draw);
  if (secSel) secSel.addEventListener("change", draw);
  if (dateSel) dateSel.addEventListener("change", function () {
    applyRange(dateSel.value);
    // job-type availability can change per range; keep selection if still valid
    if (!hasData(sel.value)) { sel.value = (sel.options[0] || {}).value || sel.value; }
    draw();
  });
  draw();
})();

</script>
</body>
</html>
